[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iwibench"
version = "0.2.3"
description = "Weight-editing tasks with isolated target execution"
authors = [{name = "Chris von Csefalvay"}, {name = "Tamás Foldi"}]
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.1",
  "pydantic>=2.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
prime = [
  "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@5dad16d40e2d025672fdb7aa75b6540c0053e4e0",
]
gpu = ["torch==2.10.0", "transformers==4.57.6", "safetensors==0.8.0", "huggingface-hub==0.36.2"]
wandb = ["wandb>=0.19"]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/iwibench"]

[tool.hatch.build.targets.wheel.force-include]
"data/facts.json" = "iwibench/data/facts.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
